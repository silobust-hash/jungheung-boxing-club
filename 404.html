<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페이지를 찾을 수 없습니다 | 중흥복싱클럽</title>
  <meta name="description" content="요청한 페이지를 찾을 수 없습니다. 중흥복싱클럽 홈에서 필요한 안내를 다시 확인해 주세요." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #3b0a0a, #0a0a0a 58%); color: #f4f4f4; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { width: min(100%, 620px); padding: 48px 36px; text-align: center; border: 1px solid rgba(225, 6, 0, .45); border-radius: 18px; background: rgba(20, 20, 20, .92); box-shadow: 0 24px 60px rgba(0, 0, 0, .4); }
    p { color: #d0d0d0; line-height: 1.7; }
    .eyebrow { margin: 0; color: #f5c518; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 12px 0; font-size: clamp(1.8rem, 5vw, 2.7rem); }
    a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 10px; background: linear-gradient(135deg, #e10600, #b30000); color: #fff; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f5c518; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · PAGE NOT FOUND</p>
    <h1>요청한 페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 존재하지 않는 페이지입니다. 중흥복싱클럽 홈에서 필요한 안내를 다시 확인해 주세요.</p>
    <a href="/">중흥복싱클럽 홈으로</a>
  </main>
</body>
</html>
